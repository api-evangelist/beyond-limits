aid: beyond-limits
name: Beyond Limits
description: 'Beyond Limits (trading as BeyondAI) is an enterprise and industrial artificial
  intelligence company founded in 2014 and headquartered in Glendale, California, built
  on cognitive and neuro-symbolic AI technology licensed from Caltech and NASA''s Jet
  Propulsion Laboratory. Its Hybrid AI Platform combines machine learning, generative
  AI and rule-based symbolic reasoning so that industrial operators get explainable,
  auditable recommendations instead of black-box predictions. Products include the
  Hybrid AI Platform (with Data, ML Ops/PRE, KB Ops and a low-code API available under
  a development license), Operations Advisor, Beyond Search generative AI, AI in a
  Box on-premises infrastructure, and DocLink document process automation from its
  Altec subsidiary. The company sells into energy and LNG, oil and gas, refining, petrochemicals,
  utilities, mining, manufacturing, aerospace and critical infrastructure. Beyond Limits
  publishes no public developer portal, API reference or self-service sign-up; platform
  API access is granted to licensed customers, so there is no publicly discoverable
  machine-readable contract for this provider.'
